name: Build and Publish Antigravity APT Packages

on:
  schedule:
    # Runs twice daily at 04:00 and 16:00 UTC
    - cron: '0 4,16 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuilding of packages even if already released'
        required: false
        default: false
        type: boolean
      product:
        description: 'Product to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - desktop
          - ide
      mode:
        description: 'Build mode'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - latest
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "apt-repo-publish"
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Debian packaging & GPG tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev xz-utils zstd gnupg curl file jq

      - name: Import GPG Key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            echo "GPG private key imported successfully."
            gpg --list-secret-keys
          else
            echo "::warning::GPG_PRIVATE_KEY is not configured in repository secrets. Packages will be published without GPG signature."
          fi

      - name: Discover and Build Packages
        id: build_step
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INPUT_PRODUCT: ${{ inputs.product || 'all' }}
          INPUT_MODE: ${{ inputs.mode || 'all' }}
          FORCE_BUILD: ${{ inputs.force_build || 'false' }}
        run: |
          mkdir -p deb-dist repo-dist

          EXTRA_DISCOVER_ARGS=""
          if [ "$FORCE_BUILD" != "true" ]; then
            EXTRA_DISCOVER_ARGS="--github-repo $GITHUB_REPOSITORY"
          fi

          echo "Discovering versions for arch=amd64 (product=$INPUT_PRODUCT, mode=$INPUT_MODE)..."
          python3 scripts/discover_versions.py --arch amd64 --product "$INPUT_PRODUCT" --mode "$INPUT_MODE" --output-dir deb-dist $EXTRA_DISCOVER_ARGS --json > versions.json

          BUILT_COUNT=0

          while IFS='|' read -r prod pkg ver build_id url needs_build; do
            [ -n "$prod" ] || continue
            [ -n "$ver" ] || continue

            if [ "$needs_build" != "True" ] && [ "$FORCE_BUILD" != "true" ]; then
              echo ">>> Skipping $pkg v$ver (already published)."
              continue
            fi

            echo "========================================================"
            echo ">>> Building $pkg v$ver ($prod) from: $url"
            echo "========================================================"

            if bash scripts/build_deb.sh "$prod" "$ver" "$url" amd64 deb-dist; then
              BUILT_COUNT=$((BUILT_COUNT + 1))
              DEB_FILE="$(find deb-dist -name "${pkg}_${ver}*amd64.deb" | head -n 1)"
              if [ -n "$DEB_FILE" ] && [ -f "$DEB_FILE" ]; then
                SHA256="$(sha256sum "$DEB_FILE" | awk '{print $1}')"
                TAG="${pkg}-v${ver}"
                TITLE="Google $prod v$ver"
                if [ "$prod" = "desktop" ]; then
                  TITLE="Google Antigravity 2.0 v$ver"
                else
                  TITLE="Google Antigravity IDE v$ver"
                fi

                echo ">>> Creating GitHub Release $TAG..."
                DEB_BASENAME="$(basename "$DEB_FILE")"
                python3 scripts/make_release_notes.py "$TITLE" "$DEB_BASENAME" "$SHA256" "$build_id" "$url" "$pkg" release_notes.md

                gh release delete "$TAG" --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
                gh release create "$TAG" "$DEB_FILE" \
                  --title "$TITLE" \
                  --notes-file release_notes.md \
                  --repo "$GITHUB_REPOSITORY" || echo "Warning: Failed creating GitHub release $TAG"
              fi
            else
              echo "::error::Failed to build $pkg v$ver"
            fi
          done < <(python3 -c "
          import json
          data = json.load(open('versions.json'))
          for prod, items in data.get('products', {}).items():
              for it in items:
                  print(f\"{it['product']}|{it['pkg_name']}|{it['version']}|{it['build_id']}|{it['url']}|{it['needs_build']}\")
          ")

          echo "built_count=$BUILT_COUNT" >> "$GITHUB_OUTPUT"

      - name: Generate Flat APT Repository Metadata
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID || '18EBB53D09F5866F73EB94CF81435F158DF507A0' }}
        run: |
          mkdir -p repo-dist

          if [ -d deb-dist ] && [ "$(find deb-dist -name "*.deb" | wc -l)" -gt 0 ]; then
            cp -f deb-dist/*.deb repo-dist/
          fi

          # Pull every historical .deb from the per-version release tags so the
          # flat index stays cumulative across runs.
          python3 scripts/sync_release_assets.py repo-dist

          bash scripts/update_repo.sh repo-dist

          echo "Repository files prepared in repo-dist:"
          ls -la repo-dist/

      - name: Publish Rolling APT Repository (GitHub Release 'apt')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FORCE_BUILD: ${{ inputs.force_build || 'false' }}
        run: |
          set -euo pipefail
          APT_TAG="apt"

          if [ ! -f repo-dist/Packages ] || [ "$(find repo-dist -maxdepth 1 -name '*.deb' | wc -l)" -eq 0 ]; then
            echo "::warning::No .deb packages found; skipping rolling repository publish."
            exit 0
          fi

          # Create the rolling release once; afterwards it is only updated in place.
          if ! gh release view "$APT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$APT_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "APT Rolling Repository (flat)" \
              --notes "Flat Debian/Ubuntu APT repository. Add with:
                 deb [signed-by=/etc/apt/keyrings/antigravity.gpg] https://github.com/$GITHUB_REPOSITORY/releases/download/apt ./
                 Do not delete this release."
          fi

          # Upload only .deb assets that are not yet present on the rolling
          # release (all are re-uploaded when a forced rebuild is requested).
          mapfile -t EXISTING < <(gh release view "$APT_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)

          for deb in repo-dist/*.deb; do
            [ -f "$deb" ] || continue
            name="$(basename "$deb")"
            if [ "$FORCE_BUILD" = "true" ] || ! printf '%s\n' "${EXISTING[@]}" | grep -qxF "$name"; then
              echo ">>> Uploading $name to $APT_TAG"
              gh release upload "$APT_TAG" "$deb" --repo "$GITHUB_REPOSITORY" --clobber
            else
              echo ">>> Skipping $name (already present on $APT_TAG)"
            fi
          done

          # Metadata last: package index before the signed Release so apt never
          # sees a Release whose checksums are not yet satisfied.
          gh release upload "$APT_TAG" repo-dist/Packages repo-dist/Packages.gz \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$APT_TAG" repo-dist/Release repo-dist/Release.gpg repo-dist/InRelease \
            --repo "$GITHUB_REPOSITORY" --clobber

          echo "Rolling APT repository published at:"
          echo "  https://github.com/$GITHUB_REPOSITORY/releases/download/$APT_TAG/"

      - name: Deploy Public Key & Landing Page to GitHub Pages (gh-pages)
        run: |
          mkdir -p pages-dist
          cp -f repo-dist/public.key pages-dist/public.key
          cp -f repo-dist/index.html pages-dist/index.html
          ls -la pages-dist/

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages-dist
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
