name: Build and Publish Antigravity APT Packages

on:
  schedule:
    # Runs twice daily at 04:00 and 16:00 UTC
    - cron: '0 4,16 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuilding of packages even if already released'
        required: false
        default: false
        type: boolean
      product:
        description: 'Product to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - desktop
          - ide
      mode:
        description: 'Build mode'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - latest
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "apt-repo-publish"
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Debian packaging & GPG tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev xz-utils zstd gnupg curl file jq

      - name: Import GPG Key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            echo "GPG private key imported successfully."
            gpg --list-secret-keys
          else
            echo "::warning::GPG_PRIVATE_KEY is not configured in repository secrets. Packages will be published without GPG signature."
          fi

      - name: Discover and Build Packages
        id: build_step
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INPUT_PRODUCT: ${{ inputs.product || 'all' }}
          INPUT_MODE: ${{ inputs.mode || 'all' }}
          FORCE_BUILD: ${{ inputs.force_build || 'false' }}
        run: |
          mkdir -p deb-dist repo-dist

          # Check if we should ignore existing github releases
          EXTRA_DISCOVER_ARGS=""
          if [ "$FORCE_BUILD" != "true" ]; then
            EXTRA_DISCOVER_ARGS="--github-repo $GITHUB_REPOSITORY"
          fi

          echo "Discovering versions for arch=amd64 (product=$INPUT_PRODUCT, mode=$INPUT_MODE)..."
          JSON_RES="$(python3 scripts/discover_versions.py --arch amd64 --product "$INPUT_PRODUCT" --mode "$INPUT_MODE" --output-dir deb-dist $EXTRA_DISCOVER_ARGS --json)"
          echo "$JSON_RES" > versions.json

          BUILT_COUNT=0

          # Iterate through versions and build missing packages
          while IFS='|' read -r prod pkg ver build_id url needs_build; do
            [ -n "$prod" ] || continue
            [ -n "$ver" ] || continue

            if [ "$needs_build" != "True" ] && [ "$FORCE_BUILD" != "true" ]; then
              echo ">>> Skipping $pkg v$ver (already published)."
              continue
            fi

            echo "========================================================"
            echo ">>> Building $pkg v$ver ($prod) from: $url"
            echo "========================================================"

            if bash scripts/build_deb.sh "$prod" "$ver" "$url" amd64 deb-dist; then
              BUILT_COUNT=$((BUILT_COUNT + 1))
              DEB_FILE="$(find deb-dist -name "${pkg}_${ver}*amd64.deb" | head -n 1)"
              if [ -n "$DEB_FILE" ] && [ -f "$DEB_FILE" ]; then
                SHA256="$(sha256sum "$DEB_FILE" | awk '{print $1}')"
                TAG="${pkg}-v${ver}"
                TITLE="Google $prod v$ver"
                if [ "$prod" = "desktop" ]; then
                  TITLE="Google Antigravity 2.0 v$ver"
                else
                  TITLE="Google Antigravity IDE v$ver"
                fi

                echo ">>> Creating GitHub Release $TAG..."
                RELEASE_NOTES="### $TITLE (Debian/Ubuntu package)

- **Package**: \`$(basename "$DEB_FILE")\`
- **Architecture**: \`amd64\`
- **SHA256**: \`$SHA256\`
- **Upstream Build**: \`$build_id\`
- **Official Source**: [$url]($url)

#### Installation via APT
\`\`\`bash
# Add repository
curl -fsSL https://chmuri.github.io/antigravity-deb/public.key | sudo gpg --dearmor -o /etc/apt/keyrings/antigravity.gpg
echo \"deb [signed-by=/etc/apt/keyrings/antigravity.gpg] https://chmuri.github.io/antigravity-deb/ ./\" | sudo tee /etc/apt/sources.list.d/antigravity.list
sudo apt-get update
sudo apt-get install -y $pkg
\`\`\`

#### Direct Download
Download the \`.deb\` asset attached below and install with:
\`\`\`bash
sudo apt install ./$(basename "$DEB_FILE")
\`\`\`
"
                gh release delete "$TAG" --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
                gh release create "$TAG" "$DEB_FILE" \
                  --title "$TITLE" \
                  --notes "$RELEASE_NOTES" \
                  --repo "$GITHUB_REPOSITORY" || echo "Warning: Failed creating GitHub release $TAG"
              fi
            else
              echo "::error::Failed to build $pkg v$ver"
            fi
          done < <(python3 -c "
          import json
          data = json.load(open('versions.json'))
          for prod, items in data.get('products', {}).items():
              for it in items:
                  print(f\"{it['product']}|{it['pkg_name']}|{it['version']}|{it['build_id']}|{it['url']}|{it['needs_build']}\")
          ")

          echo "built_count=$BUILT_COUNT" >> "$GITHUB_OUTPUT"

      - name: Fetch existing APT repository indexes from gh-pages
        run: |
          mkdir -p repo-dist
          # Download existing Packages and public.key from live gh-pages if available
          curl -fsSL "https://chmuri.github.io/antigravity-deb/Packages" -o repo-dist/Packages.old 2>/dev/null || true
          curl -fsSL "https://chmuri.github.io/antigravity-deb/public.key" -o repo-dist/public.key 2>/dev/null || cp -f public.key repo-dist/public.key

      - name: Generate and Sign APT Repository Metadata
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID || '18EBB53D09F5866F73EB94CF81435F158DF507A0' }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          # Copy any freshly built deb files into repo-dist for indexing
          if [ -d deb-dist ] && [ "$(find deb-dist -name "*.deb" | wc -l)" -gt 0 ]; then
            cp -f deb-dist/*.deb repo-dist/
          fi

          # Also download existing published deb files from GitHub Releases if repo-dist has fewer than available releases
          python3 - <<'PY'
          import json, urllib.request, subprocess, os
          repo = os.environ.get('GITHUB_REPOSITORY', 'chmuri/antigravity-deb')
          token = os.environ.get('GITHUB_TOKEN')
          url = f"https://api.github.com/repos/{repo}/releases?per_page=100"
          headers = {"User-Agent": "antigravity-builder", "Accept": "application/vnd.github+json"}
          if token:
              headers["Authorization"] = f"Bearer {token}"
          try:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  releases = json.loads(resp.read().decode('utf-8'))
              for r in releases:
                  for a in r.get('assets', []):
                      name = a.get('name', '')
                      dl_url = a.get('browser_download_url', '')
                      dest = os.path.join('repo-dist', name)
                      if name.endswith('.deb') and not os.path.exists(dest):
                          print(f"Downloading existing asset {name} for APT indexing...")
                          subprocess.run(['curl', '-fsSL', '-o', dest, dl_url], check=True)
          except Exception as e:
              print(f"Notice: {e}")
          PY

          # Run update_repo.sh to build Packages, Release, InRelease, index.html
          bash scripts/update_repo.sh repo-dist

          # Clean up large .deb files from repo-dist so gh-pages stays lightweight
          # The Packages file points to direct GitHub Releases download URLs!
          rm -f repo-dist/*.deb

          echo "Repository files prepared in repo-dist:"
          ls -la repo-dist/

      - name: Deploy to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo-dist
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
